<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Site Blocked!</title>
  <style>
    body {
      font-family: sans-serif;
      height: 90vh;
      margin: 0;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .popup {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-align: center;
    }
    ul {
      text-align: left;
      font-size: 1.1em;
    }
    .actions {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    button {
      padding: 8px 12px;
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1em;
      transition: background-color 0.2s ease;
    }
    .stats {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
      text-align: left;
      font-size: 0.9em;
      color: #111827;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }
    .stats-label {
      color: #6b7280;
      display: block;
    }
    .stats-value {
      font-weight: 700;
      font-size: 1.2em;
    }
    #stats-recent-decisions {
      margin: 6px 0 0 16px;
      padding: 0;
      font-size: 0.95em;
    }
    .stats-more-link {
      margin-top: 10px;
      display: inline-block;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    button.secondary {
      background-color: #2563eb;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="popup">
    <h2>🚫 This site is blocked!</h2>
    <p>Maybe do one of these instead:</p>
    <ul>
      <li>📖 Read a book</li>
      <li>🏃‍♀️ Go for a run</li>
      <li>✅ Complete a task</li>
      <li>📝 Improve a skill</li>
    </ul>
    <div id="actions" class="actions"></div>
    <div id="stats" class="stats">
      <div class="stats-grid">
        <div>
          <span class="stats-label" title="Blocked page visits recorded today.">Blocked today</span>
          <span class="stats-value" id="stats-blocked-attempts">0</span>
        </div>
        <div>
          <span class="stats-label" title="Temporary access sessions started today.">Allows today</span>
          <span class="stats-value" id="stats-temp-allows">0</span>
        </div>
        <div>
          <span class="stats-label" title="Active tab time spent on blocked sites while temporary access was enabled.">Temp access time</span>
          <span class="stats-value" id="stats-temp-allow-used-minutes">0</span>
        </div>
      </div>
      <strong>Recent decisions</strong>
      <ul id="stats-recent-decisions">
        <li>No decisions yet today.</li>
      </ul>
      <a id="stats-more-link" class="stats-more-link" href="stats.html">See more stats</a>
    </div>
  </div>

  <script src="redirect.js"></script>
</body>
</html>
