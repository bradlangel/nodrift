<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Blocked!</title>
  <style>
    body {
      font-family: sans-serif;
      min-height: 100vh;
      margin: 0;
      background-color: #f6f7f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(28px, 10vh, 72px) 12px 20px;
      box-sizing: border-box;
    }
    .popup {
      background-color: #ffffff;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(17,24,39,0.14);
      text-align: center;
      width: min(100%, 390px);
      box-sizing: border-box;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      line-height: 1.25;
    }
    p {
      margin: 0 0 12px;
      color: #4b5563;
    }
    ul {
      text-align: left;
      font-size: 0.94rem;
      line-height: 1.45;
      margin: 0;
      max-width: none;
      padding: 0;
    }
    .alternative-list {
      list-style: none;
    }
    .alternative-list li {
      align-items: baseline;
      color: #374151;
      display: grid;
      gap: 9px;
      grid-template-columns: 8px minmax(0, 1fr);
      margin-bottom: 6px;
    }
    .alternative-list li::before {
      background: #dff3ee;
      border-radius: 999px;
      content: "";
      height: 6px;
      justify-self: center;
      margin-top: 0.64em;
      width: 6px;
    }
    .alternative-list a,
    .alternative-list button {
      border: 0;
      background: transparent;
      color: #176b5d;
      cursor: pointer;
      display: inline;
      font: inherit;
      font-weight: 650;
      line-height: inherit;
      margin: 0;
      min-height: 0;
      padding: 0;
      text-align: left;
      text-decoration: none;
      width: auto;
    }
    .alternative-list a:hover,
    .alternative-list button:hover {
      text-decoration: underline;
    }
    .alternative-list button:disabled {
      cursor: wait;
      opacity: 0.75;
    }
    .actions {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .section-title {
      margin: 0 0 8px;
      color: #111827;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: left;
    }
    .section-title[hidden] {
      display: none;
    }
    .actions-primary,
    .actions-secondary {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .actions-primary {
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
    }
    button {
      min-height: 44px;
      padding: 10px 14px;
      border: none;
      background-color: #2f7d46;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      transition: background-color 0.2s ease;
      width: 100%;
    }
    .stats {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #e5e7eb;
      text-align: left;
      font-size: 0.82rem;
      color: #111827;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 6px;
    }
    .stats-label {
      color: #6b7280;
      display: block;
    }
    .stats-value {
      font-weight: 700;
      font-size: 1rem;
    }
    #stats-recent-decisions {
      display: none;
      margin: 6px 0 0 16px;
      padding: 0;
      font-size: 0.95em;
    }
    .stats strong {
      display: none;
    }
    .surface-links {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .surface-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .surface-links a:hover {
      text-decoration: underline;
    }
    .request-access {
      margin-top: 14px;
      text-align: left;
      border-top: 1px solid #e5e7eb;
      padding-top: 12px;
    }
    .request-access-header {
      align-items: flex-start;
      display: grid;
      gap: 7px;
      margin-bottom: 10px;
    }
    .request-access h3 {
      margin: 0;
      font-size: 1rem;
    }
    .request-access-provider {
      align-items: center;
      background: #dff3ee;
      border-radius: 999px;
      color: #0f5a4d;
      display: inline-flex;
      font-size: 0.78rem;
      font-weight: 800;
      justify-self: start;
      line-height: 1;
      margin: 0;
      padding: 6px 9px;
    }
    .request-access[hidden] {
      display: none;
    }
    .request-access-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    .sr-only {
      clip: rect(0, 0, 0, 0);
      border: 0;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      padding: 0;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }
    .request-access input,
    .request-access textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      padding: 8px;
      box-sizing: border-box;
    }
    .request-access textarea {
      min-height: 72px;
      resize: vertical;
    }
    .request-access-meta {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 6px;
      color: #8a4b00;
      font-size: 0.86rem;
      line-height: 1.4;
      margin-bottom: 10px;
      padding: 9px 10px;
    }
    .request-access-meta strong {
      color: #111827;
    }
    .request-access-result {
      background: #f8fafc;
      border: 1px solid #dbe3ee;
      border-radius: 6px;
      color: #1f2937;
      font-size: 0.9rem;
      font-weight: 650;
      line-height: 1.4;
      margin: 0 0 10px;
      min-height: 20px;
      padding: 9px 10px;
      text-align: left;
    }
    .request-access-result:empty {
      display: none;
    }
    .request-access-result.fail {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #a12626;
    }
    .request-access-result.pass {
      background: #ecfdf5;
      border-color: #bdebdc;
      color: #065f46;
    }
    .request-access-result.thinking {
      color: #1f2937;
      display: inline-block;
      font-weight: 650;
      background: linear-gradient(100deg, #374151 0%, #374151 42%, #cbd5e1 50%, #6b7280 58%, #374151 66%, #374151 100%);
      background-position: 100% 0;
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      border: 0;
      color: transparent;
      padding: 0;
      animation: thinking-sheen 4.8s linear infinite;
    }
    @keyframes thinking-sheen {
      0% {
        background-position: 100% 0;
      }
      100% {
        background-position: 0% 0;
      }
    }
    button.secondary {
      background-color: #1d4ed8;
    }
    .request-access button.secondary {
      background-color: #176b5d;
    }
    button.secondary-action {
      background-color: #374151;
    }
    .alternative-list button.secondary,
    .alternative-list button.secondary-action {
      background: transparent;
      color: #2563eb;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
    @media (min-width: 520px) {
      body {
        justify-content: center;
        padding: 20px;
      }
      .popup {
        padding: 22px;
        width: 430px;
      }
      h2 {
        font-size: 1.35rem;
      }
      #stats-recent-decisions,
      .stats strong {
        display: block;
      }
      ul {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="popup">
    <h2>🚫 This site is blocked!</h2>
    <h3 id="alternatives-title" class="section-title">Maybe do one of these instead</h3>
    <ul id="alternative-list" class="alternative-list">
      <li>Read a book</li>
      <li>Go for a run</li>
    </ul>
    <div id="actions" class="actions"></div>
    <section id="request-access" class="request-access" aria-label="Request access" hidden>
      <div class="request-access-header">
        <h3>Intent check</h3>
        <p class="request-access-provider" id="request-access-provider" hidden></p>
      </div>
      <p class="request-access-meta" id="request-access-meta" hidden></p>
      <div id="request-access-result" class="request-access-result" aria-live="polite"></div>
      <div class="request-access-row">
        <label for="request-purpose" class="sr-only">Make your request</label>
        <textarea id="request-purpose" placeholder="Describe why you need access to this site and for how long."></textarea>
      </div>
      <button id="request-access-btn" class="secondary">Check intent</button>
    </section>
    <div id="stats" class="stats">
      <h3 class="section-title">Today’s stats</h3>
      <div class="stats-grid">
        <div>
          <span class="stats-label" title="Blocked page visits recorded today.">Blocked today</span>
          <span class="stats-value" id="stats-blocked-attempts">0</span>
        </div>
        <div>
          <span class="stats-label" title="Temporary access sessions started today.">Allows today</span>
          <span class="stats-value" id="stats-temp-allows">0</span>
        </div>
        <div>
          <span class="stats-label" title="Active tab time spent on blocked sites while temporary access was enabled.">Temp access time</span>
          <span class="stats-value" id="stats-temp-allow-used-minutes">0</span>
        </div>
      </div>
      <strong>Recent decisions</strong>
      <ul id="stats-recent-decisions">
        <li>No decisions yet today.</li>
      </ul>
      <nav class="surface-links" aria-label="Extension pages">
        <a id="stats-more-link" href="stats.html">More stats</a>
        <a id="options-link" href="options.html">Settings</a>
      </nav>
    </div>
  </div>

  <script src="redirect.js"></script>
</body>
</html>
