<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Site Blocked!</title>
  <style>
    body {
      font-family: sans-serif;
      height: 90vh;
      margin: 0;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .popup {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-align: center;
    }
    ul {
      text-align: left;
      font-size: 1.1em;
    }
    .actions {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    button {
      padding: 8px 12px;
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1em;
      transition: background-color 0.2s ease;
    }
    button.secondary {
      background-color: #2563eb;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="popup">
    <h2>🚫 This site is blocked!</h2>
    <p>Maybe do one of these instead:</p>
    <ul>
      <li>📖 Read a book</li>
      <li>🏃‍♀️ Go for a run</li>
      <li>✅ Complete a task</li>
      <li>📝 Improve a skill</li>
    </ul>
    <div class="actions">
      <button id="redirect-btn">Go to Career Tracker</button>
      <button id="peek-chatgpt-btn" class="secondary" title="Opens ChatGPT with your prompt and a quick page snapshot so you can review and send it yourself">Peek with ChatGPT</button>
    </div>
  </div>

  <script src="redirect.js"></script>
</body>
</html>
