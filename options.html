<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website Blocker Settings</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --border: #d6dde8;
      --border-soft: #e7ebf1;
      --text: #111827;
      --muted: #566273;
      --accent: #176b5d;
      --accent-strong: #0f5a4d;
      --button-soft: #e7eef6;
      --button-soft-text: #1f344d;
      --warning: #8a4b00;
      --ok: #075e48;
      --danger: #a12626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100% - 24px, 760px);
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    .page-header {
      display: grid;
      gap: 10px;
      margin-bottom: 10px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      font-size: 1.6rem;
      line-height: 1.15;
      margin-bottom: 2px;
    }

    h2 {
      font-size: 1.02rem;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .chrome-note,
    .hint {
      color: var(--muted);
      line-height: 1.45;
    }

    .chrome-note {
      margin-bottom: 0;
    }

    .settings-stack {
      display: grid;
    }

    .settings-panel {
      border-top: 1px solid var(--border);
      padding: 18px 0;
    }

    .settings-panel:first-child {
      border-top: 0;
    }

    .form-grid,
    .field {
      display: grid;
      gap: 12px;
    }

    .field {
      gap: 6px;
    }

    .field-row {
      display: grid;
      gap: 12px;
    }

    label,
    .label {
      font-weight: 750;
    }

    textarea,
    input[type="number"],
    input[type="password"],
    input[type="text"],
    select {
      background: #ffffff;
      border: 1px solid #c6cfdd;
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      padding: 10px 11px;
      width: 100%;
    }

    textarea {
      min-height: 178px;
      resize: vertical;
    }

    input[type="range"] {
      width: 100%;
    }

    .checkbox-row {
      align-items: flex-start;
      display: flex;
      gap: 10px;
    }

    .checkbox-row input {
      flex: 0 0 auto;
      margin-top: 4px;
    }

    .hint {
      font-size: 0.9rem;
      margin: 0;
    }

    .hint.warning {
      color: var(--warning);
    }

    .hint.ok {
      color: var(--ok);
    }

    .hint.danger {
      color: var(--danger);
    }

    .sites-actions {
      align-items: stretch;
      display: grid;
      gap: 10px;
    }

    .range-row {
      align-items: center;
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .range-value {
      color: var(--text);
      font-weight: 800;
      min-width: 94px;
      text-align: right;
    }

    .gate-settings[hidden] {
      display: none;
    }

    .llm-panel {
      display: grid;
      gap: 12px;
    }

    .save-row {
      align-items: stretch;
      border-top: 1px solid var(--border);
      display: grid;
      gap: 10px;
      padding-top: 18px;
    }

    #save-status {
      color: var(--ok);
      min-height: 20px;
    }

    button {
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      min-height: 42px;
      padding: 9px 15px;
    }

    .primary-button {
      background: var(--accent);
      color: #ffffff;
    }

    .primary-button:hover {
      background: var(--accent-strong);
    }

    .secondary-button {
      background: var(--button-soft);
      color: var(--button-soft-text);
    }

    @media (min-width: 640px) {
      main {
        width: min(100% - 40px, 820px);
        padding: 28px 0 40px;
      }

      .page-header {
        align-items: end;
        grid-template-columns: minmax(0, 1fr) auto;
      }

      h1 {
        font-size: 1.85rem;
      }

      .field-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .sites-actions,
      .save-row {
        align-items: center;
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .save-row {
        justify-items: end;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <h1>Settings</h1>
        <p class="chrome-note">Chrome-only for v1.</p>
      </div>
    </header>

    <div class="settings-stack">
      <section class="settings-panel" aria-labelledby="sites-heading">
        <h2 id="sites-heading">Blocked Sites</h2>
        <div class="form-grid">
          <div class="field">
            <label for="sites">Domains</label>
            <textarea id="sites" spellcheck="false"></textarea>
            <div class="sites-actions">
              <p id="sites-summary" class="hint" aria-live="polite"></p>
              <button type="button" id="clean-sites" class="secondary-button">Clean list</button>
            </div>
          </div>
        </div>
      </section>

      <section class="settings-panel" aria-labelledby="access-heading">
        <h2 id="access-heading">Access Flow</h2>
        <div class="form-grid">
          <div class="field">
            <label for="access-gate-action">Primary action</label>
            <select id="access-gate-action"></select>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="temp-allow-minutes">Temporary allow minutes</label>
              <input type="number" id="temp-allow-minutes" value="30" min="1" />
            </div>
            <label class="checkbox-row">
              <input type="checkbox" id="grayscale-temp-allow" checked />
              <span>Grayscale during temporary allow</span>
            </label>
          </div>

          <label class="checkbox-row">
            <input type="checkbox" id="show-career-tracker-redirect" checked />
            <span>Show Career Tracker redirect</span>
          </label>

          <div class="field-row">
            <div class="field">
              <label for="redirect-url">Redirect URL</label>
              <input type="text" id="redirect-url" />
            </div>
            <div class="field">
              <label for="redirect-btn-text">Redirect button text</label>
              <input type="text" id="redirect-btn-text" />
            </div>
          </div>

          <label class="checkbox-row">
            <input type="checkbox" id="show-chatgpt-peek" checked />
            <span>Show Peek with ChatGPT</span>
          </label>
        </div>
      </section>

      <section id="llm-gate-settings" class="settings-panel gate-settings" aria-labelledby="llm-heading" hidden>
        <h2 id="llm-heading">LLM Review</h2>
        <div class="llm-panel">
          <p class="hint">Privacy: request purpose, requested URL/domain, requested minutes, time/day, and small local stats context are sent to your provider.</p>
          <div class="field-row">
            <div class="field">
              <label for="llm-provider">Provider</label>
              <select id="llm-provider">
                <option value="openai">OpenAI</option>
                <option value="chrome-local">Chrome local LLM</option>
              </select>
            </div>
            <div class="field" id="openai-model-field">
              <label for="openai-model">OpenAI model</label>
              <input type="text" id="openai-model" placeholder="gpt-5-nano" />
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="llm-review-strictness">Purpose scrutiny</label>
              <div class="range-row">
                <input type="range" id="llm-review-strictness" min="1" max="5" step="1" value="3" />
                <span id="llm-review-strictness-label" class="range-value">Balanced</span>
              </div>
            </div>
            <div class="field">
              <label for="llm-leisure-allowance">Leisure allowance</label>
              <div class="range-row">
                <input type="range" id="llm-leisure-allowance" min="1" max="5" step="1" value="3" />
                <span id="llm-leisure-allowance-label" class="range-value">Planned</span>
              </div>
            </div>
          </div>

          <div class="field" id="openai-api-key-field">
            <label for="openai-api-key">OpenAI API key</label>
            <input type="password" id="openai-api-key" placeholder="sk-..." autocomplete="off" />
            <p class="hint">Stored locally in this browser.</p>
          </div>

          <p id="llm-config-status" class="hint warning" aria-live="polite"></p>
        </div>
      </section>

      <div class="save-row">
        <span id="save-status" aria-live="polite"></span>
        <button id="save" class="primary-button">Save settings</button>
      </div>
    </div>
  </main>
  <script src="options.js"></script>
</body>
</html>
