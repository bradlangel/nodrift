<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>NoDrift</title>
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
      background: #f8fafc;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 650;
    }
    #current-site {
      min-height: 18px;
      margin: 0 0 12px;
      color: #475569;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .grant {
      display: none;
      margin: 0 0 12px;
      padding: 10px;
      border: 1px solid #fbbf24;
      border-radius: 6px;
      background: #fffbeb;
      color: #17202a;
      font-size: 12px;
      line-height: 1.35;
    }
    .grant.visible {
      display: block;
    }
    .grant strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .grant-row {
      margin-top: 4px;
    }
    .grant-label {
      color: #64748b;
      font-weight: 650;
    }
    .actions {
      display: grid;
      gap: 8px;
    }
    button {
      width: 100%;
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      padding: 8px 10px;
      color: #ffffff;
      background: #2563eb;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #334155;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }
    #status {
      min-height: 16px;
      margin: 10px 0 0;
      color: #475569;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>NoDrift</h1>
  <p id="current-site"></p>
  <section id="active-grant" class="grant" aria-live="polite"></section>
  <div class="actions">
    <button id="temporarily-allow">Temporarily allow</button>
    <button id="reblock-now" class="secondary">Re-block all now</button>
  </div>
  <p id="status"></p>
  <script type="module" src="../dist/popup.js"></script>
</body>
</html>
